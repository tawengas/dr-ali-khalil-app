<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>تسجيل الدخول — النخبة الطبية</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body {
      background: linear-gradient(160deg, #0A0A0A 0%, #1A1A1A 50%, #0F0F0F 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%; right: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(201,169,97,0.15), transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(201,169,97,0.1), transparent 50%);
      animation: floatBg 20s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, -30px); }
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 80px; height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 20px 50px rgba(201,169,97,0.4),
                  0 0 0 15px rgba(201,169,97,0.05);
      margin-bottom: 16px;
    }
    .login-logo-title {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .login-logo-title span { color: var(--gold); }
    .login-logo-subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .login-card {
      background: rgba(255,255,255,0.98);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #000;
      text-align: center;
      margin-bottom: 6px;
    }
    .login-desc {
      font-size: 13px;
      color: var(--gray);
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px; font-weight: 700;
      color: #000; margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap input {
      width: 100%;
      padding: 15px 44px 15px 16px;
      border: 1.5px solid var(--gray-light);
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      color: #000;
      background: #fff;
      transition: all .2s;
    }
    .input-wrap input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201,169,97,0.12);
    }
    .input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      pointer-events: none;
    }
    .toggle-pass {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .toggle-pass:active { color: var(--gold-dark); }
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(201,169,97,0.35);
      cursor: pointer;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .login-btn:active { transform: scale(0.97); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .demo-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--gray-light);
    }
    .demo-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .demo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .demo-btn {
      padding: 10px 14px;
      background: var(--gray-lighter);
      border: 1px solid var(--gray-light);
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all .2s;
    }
    .demo-btn:active {
      background: rgba(201,169,97,0.1);
      border-color: var(--gold);
    }
    .demo-role {
      color: var(--gold-dark);
      font-weight: 800;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color .2s;
    }
    .back-link a:active { color: var(--gold); }
  </style>
</head>
<body>

  <div class="login-container">
    
    <div class="login-logo">
      <div class="login-logo-icon">🏥</div>
      <div class="login-logo-title">النخبة <span>الطبية</span></div>
      <div class="login-logo-subtitle">ELITE MEDICAL</div>
    </div>

    <div class="login-card">
      <div class="login-title">تسجيل الدخول</div>
      <div class="login-desc">للدكاترة والمسؤولين</div>

      <form onsubmit="event.preventDefault(); doLogin();">
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="doctor@clinic.com" dir="ltr" autocomplete="email">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="••••••••" dir="ltr" autocomplete="current-password">
            <button type="button" class="toggle-pass" id="toggle-pass" onclick="togglePassword()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="login-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
          </svg>
          <span>دخول</span>
        </button>
      </form>

      <div class="demo-accounts">
        <div class="demo-title">حسابات تجريبية (اضغط للاستخدام)</div>
        <div class="demo-list">
          <button class="demo-btn" onclick="fillLogin('admin@clinic.com','Admin@2026')">
            <span>مدير النظام</span>
            <span class="demo-role">👑 ADMIN</span>
          </button>
          <button class="demo-btn" onclick="fillLogin('dr.ali@clinic.com','Ali@2026')">
            <span>د. علي خليل — جراحة</span>
            <span class="demo-role">🔬 DOCTOR</span>
          </button>
          <button class="demo-btn" onclick="fillLogin('dr.salem@clinic.com','Salem@2026')">
            <span>د. سالم شوبير — أسنان</span>
            <span class="demo-role">🦷 DOCTOR</span>
          </button>
        </div>
      </div>
    </div>

    <div class="back-link">
      <a href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        العودة للرئيسية
      </a>
    </div>

  </div>

  <script type="module">
    import { authAPI, auth } from '/js/api.js';
    import { toast, haptic, loader } from '/js/ui.js';

    // If already logged in, redirect
    if (auth.isLoggedIn()) {
      const user = auth.getUser();
      if (user && user.role === 'admin') {
        window.location.href = '/admin.html';
      } else if (user && user.role === 'doctor') {
        window.location.href = '/dashboard.html';
      }
    }

    window.togglePassword = function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      haptic.light();
    };

    window.fillLogin = function(email, password) {
      haptic.light();
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      // Auto-submit
      setTimeout(doLogin, 200);
    };

    window.doLogin = async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        toast.error('اكتب الإيميل وكلمة المرور');
        haptic.error();
        return;
      }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      loader.show();

      try {
        const data = await authAPI.login(email, password);
        loader.hide();
        haptic.success();

        if (data.success && data.user) {
          toast.success(`مرحباً ${data.user.full_name} 👋`);
          
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else if (data.user.role === 'doctor') {
              window.location.href = '/dashboard.html';
            } else {
              window.location.href = '/';
            }
          }, 800);
        } else {
          throw new Error('فشل تسجيل الدخول');
        }
      } catch (err) {
        loader.hide();
        btn.disabled = false;
        haptic.error();
        toast.error(err.message || 'الإيميل أو كلمة المرور غلط');
      }
    };

    // Enter key submits
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>

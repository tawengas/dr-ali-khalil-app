  <script type="module">
    import { auth, authAPI, clinicsAPI, servicesAPI } from '/js/api.js';
    import { toast, haptic, loader, sheet, helpers } from '/js/ui.js';
    import '/js/app.js';

    if (!auth.isLoggedIn()) {
      window.location.href = '/login.html';
    }
    const user = auth.getUser();
    if (user && user.role !== 'admin') {
      window.location.href = user.role === 'doctor' ? '/dashboard.html' : '/login.html';
    }
    document.getElementById('admin-name').textContent = user?.full_name || 'مدير';

    // ============ TABS ============
    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        haptic.light();
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
      });
    });

    // ============ ADMIN API ============
    const API_BASE = 'https://medical-app-api.gomanji-00.workers.dev';
    
    async function adminRequest(path, options = {}) {
      const token = auth.getToken();
      const res = await fetch(`${API_BASE}${path}`, {
        method: options.method || 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.error || 'فشل الطلب');
      }
      return data;
    }

    // ============ CLINICS ============
    let clinics = [];

    async function loadClinics() {
      const c = document.getElementById('clinics-list');
      c.innerHTML = '<div class="skeleton skeleton-card" style="height:120px;"></div>';
      try {
        const data = await clinicsAPI.list();
        clinics = data.data || [];
        document.getElementById('qs-clinics').textContent = clinics.length;

        if (!clinics.length) {
          c.innerHTML = '<div class="empty"><div class="empty-icon">🏥</div><div class="empty-title">لا توجد عيادات</div></div>';
          return;
        }

        c.innerHTML = clinics.map(cl => `
          <div class="item-card">
            <div class="item-top">
              <div class="item-icon">${getClinicIcon(cl.specialty)}</div>
              <div class="item-body">
                <div class="item-title">${helpers.escape(cl.name)}</div>
                <div class="item-sub">
                  ${helpers.escape(cl.specialty || 'عام')}
                  ${cl.address ? `<br>📍 ${helpers.escape(cl.address)}` : ''}
                  ${cl.phone ? `<br>📞 ${helpers.escape(cl.phone)}` : ''}
                </div>
              </div>
            </div>
            <div class="item-actions">
              <button class="item-btn btn-edit" onclick="editClinic(${cl.id})">✏️ تعديل</button>
              <button class="item-btn btn-delete" onclick="deleteClinic(${cl.id})">🗑️ حذف</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        c.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">تعذّر التحميل</div></div>`;
      }
    }

    function getClinicIcon(s) {
      if (!s) return '🏥';
      if (s.includes('أسنان') || s.includes('اسنان')) return '🦷';
      if (s.includes('جراح')) return '🔬';
      if (s.includes('جلد')) return '✨';
      if (s.includes('أطفال') || s.includes('اطفال')) return '👶';
      return '🏥';
    }

    window.showClinicForm = function(clinic = null) {
      const isEdit = !!clinic;
      const content = document.createElement('div');
      content.className = 'form-dialog';
      content.innerHTML = `
        <div class="form-group">
          <label class="form-label">اسم العيادة <span class="req">*</span></label>
          <input class="form-input" id="f-name" value="${clinic ? helpers.escape(clinic.name) : ''}" placeholder="مثال: عيادة د. أحمد">
        </div>
        <div class="form-group">
          <label class="form-label">اسم الطبيب <span class="req">*</span></label>
          <input class="form-input" id="f-doctor" value="${clinic ? helpers.escape(clinic.doctor_name || '') : ''}" placeholder="مثال: د. أحمد محمد">
        </div>
        <div class="form-group">
          <label class="form-label">التخصص</label>
          <select class="form-select" id="f-specialty">
            <option value="أسنان" ${clinic?.specialty === 'أسنان' ? 'selected' : ''}>🦷 أسنان</option>
            <option value="جراحة" ${clinic?.specialty === 'جراحة' ? 'selected' : ''}>🔬 جراحة</option>
            <option value="جلدية" ${clinic?.specialty === 'جلدية' ? 'selected' : ''}>✨ جلدية</option>
            <option value="أطفال" ${clinic?.specialty === 'أطفال' ? 'selected' : ''}>👶 أطفال</option>
            <option value="باطنة" ${clinic?.specialty === 'باطنة' ? 'selected' : ''}>💊 باطنة</option>
            <option value="عظام" ${clinic?.specialty === 'عظام' ? 'selected' : ''}>🦴 عظام</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">رقم الموبايل</label>
          <input class="form-input" id="f-phone" dir="ltr" value="${clinic ? helpers.escape(clinic.phone || '') : ''}" placeholder="+971...">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الواتساب</label>
          <input class="form-input" id="f-whatsapp" dir="ltr" value="${clinic ? helpers.escape(clinic.whatsapp || '') : ''}" placeholder="اتركه فاضي لو نفسه">
        </div>
        <div class="form-group">
          <label class="form-label">العنوان</label>
          <input class="form-input" id="f-address" value="${clinic ? helpers.escape(clinic.address || '') : ''}" placeholder="مثال: بني ياس، أبوظبي">
        </div>
        <div class="form-group">
          <label class="form-label">مواعيد العمل</label>
          <input class="form-input" id="f-hours" value="${clinic ? helpers.escape(clinic.working_hours || '') : ''}" placeholder="مثال: 9ص - 9م">
        </div>
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input class="form-input" id="f-email" dir="ltr" type="email" value="${clinic ? helpers.escape(clinic.email || '') : ''}" placeholder="clinic@example.com">
        </div>
      `;

      sheet.open({
        title: isEdit ? '✏️ تعديل عيادة' : '➕ إضافة عيادة',
        content,
        actions: [
          {
            label: isEdit ? '💾 حفظ التعديلات' : '➕ إضافة العيادة',
            variant: 'btn-primary',
            onClick: async () => {
              const payload = {
                name: document.getElementById('f-name').value.trim(),
                doctor_name: document.getElementById('f-doctor').value.trim(),
                specialty: document.getElementById('f-specialty').value,
                phone: document.getElementById('f-phone').value.trim(),
                whatsapp: document.getElementById('f-whatsapp').value.trim() || document.getElementById('f-phone').value.trim(),
                address: document.getElementById('f-address').value.trim(),
                working_hours: document.getElementById('f-hours').value.trim(),
                email: document.getElementById('f-email').value.trim()
              };

              if (!payload.name || !payload.doctor_name) {
                toast.error('الاسم واسم الطبيب مطلوبين');
                haptic.error();
                return false;
              }

              loader.show();
              try {
                if (isEdit) {
                  await adminRequest(`/api/clinics/${clinic.id}`, { method: 'PUT', body: payload });
                  toast.success('✅ تم تعديل العيادة');
                } else {
                  await adminRequest('/api/clinics', { method: 'POST', body: payload });
                  toast.success('✅ تم إضافة العيادة');
                }
                loader.hide();
                haptic.success();
                await loadClinics();
              } catch (err) {
                loader.hide();
                haptic.error();
                toast.error(err.message || 'حدث خطأ');
                return false;
              }
              return true;
            }
          },
          { label: 'إلغاء', variant: 'btn-ghost', onClick: () => {} }
        ]
      });
    };

    window.editClinic = function(id) {
      const clinic = clinics.find(c => c.id === id);
      if (clinic) { haptic.light(); showClinicForm(clinic); }
    };

    window.deleteClinic = async function(id) {
      const ok = await sheet.confirm({
        title: 'حذف العيادة؟',
        message: 'هل أنت متأكد؟ سيتم حذف كل شيء مرتبط بها.',
        confirmText: 'حذف',
        cancelText: 'إلغاء',
        variant: 'btn-dark'
      });
      if (!ok) return;

      loader.show();
      try {
        await adminRequest(`/api/clinics/${id}`, { method: 'DELETE' });
        loader.hide();
        haptic.success();
        toast.success('✅ تم حذف العيادة');
        await loadClinics();
      } catch (err) {
        loader.hide();
        toast.error(err.message || 'تعذّر الحذف');
      }
    };

    // ============ SERVICES ============
    let services = [];

    async function loadServices() {
      const c = document.getElementById('services-list');
      c.innerHTML = '<div class="skeleton skeleton-card" style="height:100px;"></div>';
      try {
        const data = await servicesAPI.list();
        services = data.data || [];
        document.getElementById('qs-services').textContent = services.length;

        if (!services.length) {
          c.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">لا توجد خدمات</div></div>';
          return;
        }

        c.innerHTML = services.map(s => `
          <div class="item-card">
            <div class="item-top">
              <div class="item-icon">${s.icon || '⚕️'}</div>
              <div class="item-body">
                <div class="item-title">${helpers.escape(s.name)}</div>
                <div class="item-sub">${helpers.escape(s.category || '')} • ${s.price_aed} AED • ${s.duration_minutes || 30} د</div>
              </div>
            </div>
            <div class="item-actions">
              <button class="item-btn btn-edit" onclick="editService(${s.id})">✏️ تعديل</button>
              <button class="item-btn btn-delete" onclick="deleteService(${s.id})">🗑️ حذف</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        c.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">تعذّر التحميل</div></div>`;
      }
    }

    window.showServiceForm = function(service = null) {
      const isEdit = !!service;
      const content = document.createElement('div');
      content.className = 'form-dialog';
      content.innerHTML = `
        <div class="form-group">
          <label class="form-label">اسم الخدمة <span class="req">*</span></label>
          <input class="form-input" id="s-name" value="${service ? helpers.escape(service.name) : ''}" placeholder="مثال: زراعة أسنان">
        </div>
        <div class="form-group">
          <label class="form-label">السعر (AED) <span class="req">*</span></label>
          <input class="form-input" id="s-price" type="number" value="${service ? service.price_aed : ''}" placeholder="500">
        </div>
        <div class="form-group">
          <label class="form-label">الفئة</label>
          <select class="form-select" id="s-cat">
            <option value="أسنان - تجميل" ${service?.category === 'أسنان - تجميل' ? 'selected' : ''}>🦷 أسنان - تجميل</option>
            <option value="أسنان - زراعة" ${service?.category === 'أسنان - زراعة' ? 'selected' : ''}>🦷 أسنان - زراعة</option>
            <option value="أسنان - علاج" ${service?.category === 'أسنان - علاج' ? 'selected' : ''}>🦷 أسنان - علاج</option>
            <option value="أسنان - تقويم" ${service?.category === 'أسنان - تقويم' ? 'selected' : ''}>📐 أسنان - تقويم</option>
            <option value="أسنان - جراحة" ${service?.category === 'أسنان - جراحة' ? 'selected' : ''}>🔧 أسنان - جراحة</option>
            <option value="أسنان - تركيبات" ${service?.category === 'أسنان - تركيبات' ? 'selected' : ''}>👑 أسنان - تركيبات</option>
            <option value="جراحة - تجميل" ${service?.category === 'جراحة - تجميل' ? 'selected' : ''}>🔬 جراحة - تجميل</option>
            <option value="جراحة - عامة" ${service?.category === 'جراحة - عامة' ? 'selected' : ''}>🔬 جراحة - عامة</option>
            <option value="جراحة - سمنة" ${service?.category === 'جراحة - سمنة' ? 'selected' : ''}>🏆 جراحة - سمنة</option>
            <option value="استشارة" ${service?.category === 'استشارة' ? 'selected' : ''}>📋 استشارة</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">الأيقونة (Emoji)</label>
          <input class="form-input" id="s-icon" value="${service ? helpers.escape(service.icon || '⚕️') : '⚕️'}" placeholder="🦷">
        </div>
        <div class="form-group">
          <label class="form-label">المدة (دقائق)</label>
          <input class="form-input" id="s-duration" type="number" value="${service ? service.duration_minutes : 30}">
        </div>
        <div class="form-group">
          <label class="form-label">الوصف</label>
          <textarea class="form-textarea" id="s-desc" placeholder="وصف مختصر للخدمة">${service ? helpers.escape(service.description || '') : ''}</textarea>
        </div>
      `;

      sheet.open({
        title: isEdit ? '✏️ تعديل خدمة' : '➕ إضافة خدمة',
        content,
        actions: [
          {
            label: isEdit ? '💾 حفظ' : '➕ إضافة',
            variant: 'btn-primary',
            onClick: async () => {
              const payload = {
                name: document.getElementById('s-name').value.trim(),
                price_aed: parseFloat(document.getElementById('s-price').value),
                category: document.getElementById('s-cat').value,
                icon: document.getElementById('s-icon').value.trim() || '⚕️',
                duration_minutes: parseInt(document.getElementById('s-duration').value) || 30,
                description: document.getElementById('s-desc').value.trim()
              };

              if (!payload.name || isNaN(payload.price_aed)) {
                toast.error('الاسم والسعر مطلوبين');
                haptic.error();
                return false;
              }

              loader.show();
              try {
                if (isEdit) {
                  await adminRequest(`/api/services/${service.id}`, { method: 'PUT', body: payload });
                  toast.success('✅ تم تعديل الخدمة');
                } else {
                  await adminRequest('/api/services', { method: 'POST', body: payload });
                  toast.success('✅ تم إضافة الخدمة');
                }
                loader.hide();
                haptic.success();
                await loadServices();
              } catch (err) {
                loader.hide();
                haptic.error();
                toast.error(err.message || 'حدث خطأ');
                return false;
              }
              return true;
            }
          },
          { label: 'إلغاء', variant: 'btn-ghost', onClick: () => {} }
        ]
      });
    };

    window.editService = function(id) {
      const s = services.find(x => x.id === id);
      if (s) { haptic.light(); showServiceForm(s); }
    };

    window.deleteService = async function(id) {
      const ok = await sheet.confirm({
        title: 'حذف الخدمة؟',
        message: 'هل أنت متأكد من الحذف؟',
        confirmText: 'حذف',
        cancelText: 'إلغاء',
        variant: 'btn-dark'
      });
      if (!ok) return;

      loader.show();
      try {
        await adminRequest(`/api/services/${id}`, { method: 'DELETE' });
        loader.hide();
        haptic.success();
        toast.success('✅ تم حذف الخدمة');
        await loadServices();
      } catch (err) {
        loader.hide();
        toast.error(err.message || 'تعذّر الحذف');
      }
    };

    // ============ LOGOUT ============
    window.logout = async function() {
      const ok = await sheet.confirm({
        title: 'تسجيل الخروج؟',
        message: 'هل تريد الخروج؟',
        confirmText: 'خروج',
        cancelText: 'إلغاء',
        variant: 'btn-dark'
      });
      if (ok) {
        await authAPI.logout();
        haptic.medium();
        window.location.href = '/login.html';
      }
    };

    // Init
    loadClinics();
    loadServices();
  </script>
</body>
</html>
